<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Fire Team</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#202020;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

.header{
    height:100px;
    background:linear-gradient(135deg,#55c9ee,#65d4f5);
    display:flex;
    align-items:center;
    justify-content:center;
}

.header h1{
    font-size:31px;
    font-weight:500;
}

.container{
    width:100%;
    max-width:520px;
    margin:28px auto;
    padding:0 16px 40px;
}

/* VIDEO */
.video-box{
    width:100%;
    aspect-ratio:16/9;
    background:#111;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 5px 20px #0008;
}

.video-box iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}

/* OFFER BORDER */
.offer-wrapper{
    margin-top:46px;
    padding:2px;
    border-radius:22px;
    background:linear-gradient(
        90deg,
        #ff0000,
        #ff8a00,
        #ffe600,
        #00ff66,
        #00d9ff,
        #8a00ff,
        #ff00d4
    );
    background-size:400% 400%;
    animation:borderMove 5s linear infinite;
}

@keyframes borderMove{
    0%{
        background-position:0 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0 50%;
    }
}

/* CARD */
.offer-card{
    background:#111;
    border-radius:20px;
    padding:20px;
}

.offer-top{
    display:flex;
    align-items:center;
    gap:15px;
}

/* IMAGE */
.offer-image{
    width:86px;
    height:86px;
    flex-shrink:0;
    border-radius:13px;
    object-fit:cover;
    background:#252525;
}

/* TEXT */
.offer-info{
    min-width:0;
    flex:1;
}

.offer-title{
    font-size:24px;
    font-weight:700;
    margin-bottom:5px;
}

.offer-subtitle{
    font-size:15px;
    color:#ddd;
    margin-bottom:7px;
}

.stars{
    color:#ffd900;
    font-size:20px;
    letter-spacing:2px;
}

/* INSTALL BUTTON */
.install-button{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:68px;
    margin-top:22px;

    background:#00e878;
    color:#fff;

    border-radius:40px;

    font-size:27px;
    font-weight:600;

    text-decoration:none;

    transition:transform .15s;
}

.install-button:active{
    transform:scale(.97);
}

/* NOTICE */
.notice{
    text-align:center;
    color:#888;
    font-size:12px;
    margin-top:17px;
}

/* MOBILE */
@media(max-width:480px){

    .header h1{
        font-size:29px;
    }

    .offer-card{
        padding:18px;
    }

    .offer-image{
        width:80px;
        height:80px;
    }

    .offer-title{
        font-size:23px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>Free Fire Team</h1>
</header>

<main class="container">

    <!-- VIDEO -->
    <div class="video-box">
        <iframe
            src="https://jumpshare.com/embed/GHaiax969ijJI2X1QgkQ"
            scrolling="no">
        </iframe>
    </div>


    <!-- OFFER -->
    <div class="offer-wrapper">

        <div class="offer-card">

            <div class="offer-top">

                <!-- LEFT IMAGE -->
                <img
                    class="offer-image"
                    src="https://i.postimg.cc/RCHjvvfx/65b5a016-b78d-4083-9650-7baf951a7242.png"
                    alt="Free Diamonds">

                <div class="offer-info">

                    <div class="offer-title">
                        Free Diamonds
                    </div>

                    <div class="offer-subtitle">
                        Get your Free Diamonds
                    </div>

                    <div class="stars">
                        ★★★★★
                    </div>

                </div>

            </div>


            <!-- INSTALL BUTTON -->
            <a
                class="install-button"
                href="https://1024terabox.com/s/1SBKn3VkLuiZR2KCzv7Bzqg"
                target="_blank"
                rel="noopener noreferrer">

                Install

            </a>

        </div>

    </div>


    <div class="notice">
        Offer availability and requirements may vary.
    </div>

</main>

</body>
</html>
